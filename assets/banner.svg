<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Sokka04 · YAWO Saramba Yohann · Full-Stack Developer</title>
  <desc id="d">Bannière originale : fond bordeaux, pièce de shōgi abstraite et lignes de terrain, palette Rakuzan.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120707"/>
      <stop offset="0.55" stop-color="#2A0C0C"/>
      <stop offset="1" stop-color="#7F1D1D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#C9A227" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="72" y1="0" x2="452" y2="0">
      <stop offset="0" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#C9A227" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#F5F0E6" opacity="0.035"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="300" rx="14"/>
    </clipPath>
  </defs>

  <!-- Fond -->
  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="14" fill="url(#glow)"/>
  <rect width="1200" height="300" rx="14" fill="url(#grain)"/>

  <!-- Lignes de terrain (cercle central) -->
  <g clip-path="url(#frame)" fill="none" stroke="#C9A227" stroke-opacity="0.11" stroke-width="1.5">
    <circle cx="985" cy="150" r="200"/>
    <circle cx="985" cy="150" r="128"/>
    <line x1="985" y1="0" x2="985" y2="300"/>
  </g>

  <!-- Anneau en pointillés, rotation lente -->
  <g transform="translate(985 150)">
    <circle r="96" fill="none" stroke="#C9A227" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="2 9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="80s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Pièce de shōgi abstraite -->
  <polygon points="985,74 1034,98 1048,222 922,222 936,98" fill="#140808" fill-opacity="0.85" stroke="#C9A227" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="985,86 1024,105 1036,212 934,212 946,105" fill="none" stroke="#C9A227" stroke-opacity="0.35" stroke-width="1"/>

  <!-- L'œil de l'empereur : moitié bordeaux, moitié or -->
  <g transform="translate(985 160)">
    <path d="M0,-24 A24,24 0 0 0 0,24 Z" fill="#7F1D1D"/>
    <path d="M0,-24 A24,24 0 0 1 0,24 Z" fill="#C9A227"/>
    <circle r="24" fill="none" stroke="#F5F0E6" stroke-width="1.5"/>
    <circle r="5" fill="#120707"/>
  </g>

  <!-- Cadre : coins dorés -->
  <g fill="none" stroke="#C9A227" stroke-opacity="0.6" stroke-width="1.5">
    <path d="M24,48 V24 H48"/>
    <path d="M1152,24 H1176 V48"/>
    <path d="M24,252 V276 H48"/>
    <path d="M1152,276 H1176 V252"/>
  </g>

  <!-- Texte -->
  <g>
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    <text x="72" y="92" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" letter-spacing="6" fill="#C9A227">SOKKA04</text>
    <text x="70" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#F5F0E6">YAWO Saramba Yohann</text>
    <text x="72" y="214" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic" fill="#F5F0E6" fill-opacity="0.88">Full-Stack Developer</text>
    <text x="72" y="248" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" letter-spacing="3" fill="#C9A227" fill-opacity="0.85">LOMÉ, TG  ·  CODE · STRATÉGIE · PRÉCISION</text>
  </g>

  <!-- Filet doré qui se trace -->
  <line x1="72" y1="176" x2="452" y2="176" stroke="url(#rule)" stroke-width="2" stroke-dasharray="380" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="380;0" dur="1.6s" begin="0.3s" fill="freeze"/>
  </line>
</svg>
